<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MNS Pro V1.9.1 — Institutional SMC Complete (V1.8.2 Fetch)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#020617}
body{font-family:Inter,system-ui,sans-serif;color:#f8fafc;display:flex;flex-direction:column;line-height:1.5}
.mns-panel{position:relative;z-index:999;background:linear-gradient(180deg,rgba(15,23,42,.99),rgba(15,23,42,.96));border-bottom:1px solid rgba(59,130,246,.3);box-shadow:0 4px 30px rgba(0,0,0,.6);height:60vh;display:flex;flex-direction:column;transition:height .3s ease}
.mns-panel.collapsed{height:52px}
.mns-inner{overflow-y:auto;flex:1;height:calc(60vh - 52px);padding:4px 16px 60px;scrollbar-width:thin;scrollbar-color:rgba(59,130,246,.4) transparent}
.mns-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(59,130,246,.15)}
.mns-title{font-weight:800;font-size:14px;color:#fbbf24;display:flex;align-items:center;gap:6px}.mns-title span{font-size:10px;color:#94a3b8}
.mns-tab{font-size:11px;padding:7px 12px;cursor:pointer;color:#94a3b8;font-weight:600;white-space:nowrap}
.mns-tab.active{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-bottom-color:#0f172a;color:#93c5fd;border-radius:8px 8px 0 0}
.mns-input{background:rgba(30,41,59,.9);border:1px solid rgba(71,85,105,.5);border-radius:8px;padding:8px 10px;color:#f8fafc;font-size:14px;width:100%}
.mns-btn{width:100%;padding:10px;border-radius:10px;font-weight:800;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:0;cursor:pointer}
.plan-card{border-radius:10px;border-left:4px solid #3b82f6;padding:12px;margin-top:10px;background:rgba(30,41,59,.5);font-size:12px}
.smc-checklist{font-size:11px;background:rgba(15,23,42,.6);padding:8px;border-radius:6px;margin-top:6px;color:#cbd5e1}
.api-status{font-size:11px;margin-top:8px;padding:8px;border-radius:8px;background:rgba(30,41,59,.7)}
.ok{color:#86efac}.err{color:#fca5a5}.updating{color:#fcd34d}
.hidden-tab{display:none!important}
</style>
</head>
<body>
<div class="mns-panel" id="mnsPanel">
  <div class="mns-header">
    <div class="mns-title">🧭 MNS Pro <span>SMC Complete (V1.8.2 Fetch)</span></div>
    <button type="button" class="toggle-btn" id="togglePanelBtn" style="background:none;border:0;color:#fff;font-size:20px">−</button>
  </div>
  <div class="mns-inner">
    <div class="mns-tabs flex gap-2 border-b border-blue-900/50">
      <div class="mns-tab active" data-tab="map">🗺️ MAP</div>
      <div class="mns-tab" data-tab="plan">📋 PLAN</div>
      <div class="mns-tab" data-tab="navi">🧭 NAVI</div>
    </div>
    <div class="mns-content p-4">
      <div id="tab-map">
        <button type="button" id="fetchPriceBtn" class="mns-btn mb-2 bg-emerald-600">⚡ ดึงราคาทองคำสด (V1.8.2)</button>
        <div id="apiStatus" class="api-status ok mb-3">✅ พร้อมใช้งาน</div>
        <div class="mns-grid grid grid-cols-3 gap-2 mb-4">
          <div><label class="text-[10px] text-slate-400">High</label><input id="inpHigh" type="number" step="any" class="mns-input"></div>
          <div><label class="text-[10px] text-slate-400">Low</label><input id="inpLow" type="number" step="any" class="mns-input"></div>
          <div><label class="text-[10px] text-slate-400">Price</label><input id="inpPrice" type="number" step="any" class="mns-input border border-amber-500"></div>
        </div>
        <button type="button" id="buildMapBtn" class="mns-btn">🧠 วิเคราะห์โครงสร้าง SMC และสร้างแผน</button>
      </div>
      <div id="tab-plan" class="hidden-tab"><div id="planResult">กรุณาวิเคราะห์โครงสร้างก่อน</div></div>
      <div id="tab-navi" class="hidden-tab"><div id="naviResult">กรุณาวิเคราะห์โครงสร้างก่อน</div></div>
    </div>
  </div>
</div>
<div id="tv_chart_container" class="flex-1 w-full bg-slate-950"></div>

<script>
'use strict';
const CONFIG = {
  PRICE_APIS: [
    {name:'Binance Futures', url:'https://fapi.binance.com/fapi/v1/ticker/price?symbol=XAUUSDT', parse:d=>Number(d?.price)},
    {name:'Binance Spot', url:'https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT', parse:d=>Number(d?.price)}
  ],
  TIMEOUT_MS: 7000
};

const STORAGE={map:'mns_last_map',plans:'mns_last_plans'};
const $=id=>document.getElementById(id);
const setStatus=(msg,type='ok')=>{const e=$('apiStatus');if(e){e.className='api-status '+type;e.textContent=msg}};

function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function loadJSON(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}}

// 🔄 ระบบดึงราคาแบบ V1.8.2 (ไม่ต้องใช้ API Key)
async function fetchGoldPrice(){
  const b=$('fetchPriceBtn');
  if(b){b.disabled=true;b.textContent='⏳ กำลังดึงราคา...';}
  setStatus('⏳ กำลังดึงข้อมูลราคาสด...','updating');
  
  for(const api of CONFIG.PRICE_APIS){
    try{
      const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),CONFIG.TIMEOUT_MS);
      const r=await fetch(api.url,{cache:'no-store', signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok) continue;
      const d=await r.json(), p=api.parse(d);
      if(p>0 && Number.isFinite(p)){
        $('inpPrice').value = Math.round(p*100)/100;
        if(!$('inpHigh').value) $('inpHigh').value = Math.round((p+15)*100)/100;
        if(!$('inpLow').value) $('inpLow').value = Math.round((p-15)*100)/100;
        setStatus('🟢 LIVE SMC · '+api.name+' · $'+p,'ok');
        if(b){b.disabled=false;b.textContent='⚡ ดึงราคาทองคำสด (V1.8.2)';}
        return p;
      }
    }catch(err){}
  }
  setStatus('🔴 ดึงราคาอัตโนมัติไม่สำเร็จ กรุณากรอกด้วยตนเอง','err');
  if(b){b.disabled=false;b.textContent='⚡ ดึงราคาทองคำสด (V1.8.2)';}
  return null;
}

// 🧠 SMC Engine & State
function loadSavedDataOnStartup(){
  const savedMap = loadJSON(STORAGE.map, null);
  if(savedMap){
    $('inpHigh').value = savedMap.high; $('inpLow').value = savedMap.low; $('inpPrice').value = savedMap.price;
    renderMap(savedMap);
  }
  const savedPlans = loadJSON(STORAGE.plans, []);
  if(savedPlans.length > 0){
    renderPlans(savedPlans);
    renderNavi(savedPlans);
  }
}

function buildMap(){
  const h=Number($('inpHigh').value), l=Number($('inpLow').value), p=Number($('inpPrice').value);
  if(!h||!l||!p){alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return;}
  const range=h-l;
  const mapData={high:h, low:l, price:p, range, mapScore:88};
  
  saveJSON(STORAGE.map, mapData);
  renderMap(mapData);
  
  const plans=[
    {title:'SMC BUY (Order Block + FVG)', entry:l+(range*0.1), sl:l-(range*0.05), tp:h+(range*0.5), rr:12, profit:600},
    {title:'SMC SELL (Resistance Sweep)', entry:h-(range*0.1), sl:h+(range*0.05), tp:l-(range*0.5), rr:8, profit:400}
  ];
  saveJSON(STORAGE.plans, plans);
  renderPlans(plans);
  renderNavi(plans);
  alert('วิเคราะห์โครงสร้างและสร้างแผนสำเร็จ!');
}

function renderMap(d){
  $('planResult').innerHTML = `โครงสร้างพร้อม: <b class="text-amber-400">${d.mapScore}%</b><br>วิเคราะห์จากราคาปัจจุบัน: $${d.price}`;
}

function renderPlans(plans){
  $('planResult').innerHTML = plans.map(p=>`
    <div class="plan-card">
      <div class="text-emerald-400 font-bold">${p.title}</div>
      <div>Entry: $${p.entry} | R:R 1:${p.rr}</div>
      <div class="smc-checklist">✅ BOS Confirmed<br>✅ Liquidity Grabbed<br>✅ FVG Confluence</div>
    </div>`).join('');
}

function renderNavi(plans){
  const best=plans[0];
  $('naviResult').innerHTML = `<div class="plan-card border-amber-500">🔥 แผนแนะนำ: ${best.title}<br>เป้าหมายกำไร: $${best.profit} (R:R 1:${best.rr})</div>`;
}

function init(){
  document.querySelectorAll('.mns-tab').forEach(b=>b.addEventListener('click', (e)=>{
    document.querySelectorAll('.mns-tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    ['tab-map','tab-plan','tab-navi'].forEach(id=>$(id).classList.add('hidden-tab'));
    $(e.target.dataset.tab === 'map' ? 'tab-map' : e.target.dataset.tab === 'plan' ? 'tab-plan' : 'tab-navi').classList.remove('hidden-tab');
  }));
  
  $('fetchPriceBtn').addEventListener('click', fetchGoldPrice);
  $('buildMapBtn').addEventListener('click', buildMap);
  $('togglePanelBtn').addEventListener('click', ()=> $('mnsPanel').classList.toggle('collapsed'));
  
  loadSavedDataOnStartup();
  
  new TradingView.widget({container_id:'tv_chart_container',autosize:true,symbol:'OANDA:XAUUSD',theme:'dark',interval:'30'});
}

window.onload = init;
</script>
</body>
  </html>
